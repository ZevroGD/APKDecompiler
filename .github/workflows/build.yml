
name: APK Decompiler

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download JADX
        run: |
          wget -q https://github.com/skylot/jadx/releases/latest/download/jadx-1.5.3.zip -O jadx.zip
          unzip -q jadx.zip -d jadx

      - name: Download Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool_2.12.1.jar -O apktool.jar

      - name: Find APK files
        run: |
          mkdir -p output
          find . -type f -name "*.apk" \
            -not -path "./output/*" \
            -print0 > apk-list

      - name: Decompile APKs
        run: |
          while IFS= read -r -d '' apk; do
            name=$(basename "$apk" .apk)
            echo "Decompiling $name"

            mkdir -p "output/$name/jadx"
            mkdir -p "output/$name/apktool"

            jadx/bin/jadx -d "output/$name/jadx" "$apk" || true
            java -jar apktool.jar d -f "$apk" -o "output/$name/apktool" || true
          done < apk-list

      - name: Upload decompiled files
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-apks
          path: output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
