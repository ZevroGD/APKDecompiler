name: Universal Decompiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip tar

      
      - name: Download JADX
        run: |
          RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/skylot/jadx/releases/latest)

          ASSET_ID=$(echo "$RELEASE" | jq -r \
            '[.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$"))][0].id')

          ASSET_NAME=$(echo "$RELEASE" | jq -r \
            '[.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$"))][0].name')

          test -n "$ASSET_ID"
          test "$ASSET_ID" != "null"

          echo "Downloading $ASSET_NAME..."

          curl -fL --retry 3 \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/skylot/jadx/releases/assets/$ASSET_ID" \
            -o jadx.zip

          unzip -t jadx.zip
          unzip -q jadx.zip -d jadx-dist

          JADX=$(find jadx-dist -type f -path '*/bin/jadx' | head -n 1)

          test -n "$JADX"
          chmod +x "$JADX"

          echo "JADX=$PWD/$JADX" >> "$GITHUB_ENV"

          echo "JADX successfully installed."


      - name: Download Apktool
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -r '[.assets[] | select(.name | test("^apktool_.*\\.jar$"))][0].browser_download_url')

          test -n "$URL"
          test "$URL" != "null"

          curl -fL "$URL" -o apktool.jar

          echo "APKTOOL=$PWD/apktool.jar" >> "$GITHUB_ENV"

      - name: Detect and decompile
        id: decompile
        shell: bash
        run: |
          WORKDIR="$RUNNER_TEMP/decompiled-output"
          SUCCESS_LIST="$RUNNER_TEMP/successful-inputs.txt"

          mkdir -p "$WORKDIR"
          : > "$SUCCESS_LIST"

          count=0
          successful=0
          any_output=false

          while IFS= read -r -d '' file; do
            rel="${file#./}"
            ext="${rel##*.}"
            ext=$(echo "$ext" | tr '[:upper:]' '[:lower:]')

            case "$ext" in
              apk|dex|jar|class|aar|aab|zip|xapk|apkm|apks)
                ;;
              *)
                continue
                ;;
            esac

            count=$((count + 1))
            out="$WORKDIR/$rel"

            mkdir -p "$out/_logs"

            input_success=false

            echo "================================"
            echo "Processing: $rel"
            echo "Format: $ext"

            # JADX
            echo "Running JADX..."

            mkdir -p "$out/jadx"

            if "$JADX" -d "$out/jadx" "$file" \
              > "$out/_logs/jadx.log" 2>&1; then

              jadx_exit=0
            else
              jadx_exit=$?
            fi

            if find "$out/jadx" -type f -print -quit | grep -q .; then
              any_output=true

              if [ "$jadx_exit" -eq 0 ]; then
                echo "JADX completed successfully."
                input_success=true
              else
                echo "JADX produced partial output."
                echo "Exit code: $jadx_exit"
              fi
            else
              echo "JADX produced no output."
              echo "Exit code: $jadx_exit"
            fi

            if [ "$jadx_exit" -ne 0 ]; then
              echo "Last JADX log lines:"
              tail -n 40 "$out/_logs/jadx.log"
            fi

            # Apktool (APK only)
            if [ "$ext" = "apk" ]; then
              echo "Running Apktool..."

              if java -jar "$APKTOOL" d -f "$file" \
                -o "$out/apktool" \
                > "$out/_logs/apktool.log" 2>&1; then

                apktool_exit=0
              else
                apktool_exit=$?
              fi

              if find "$out/apktool" -type f -print -quit | grep -q .; then
                any_output=true

                if [ "$apktool_exit" -eq 0 ]; then
                  echo "Apktool completed successfully."
                  input_success=true
                else
                  echo "Apktool produced partial output."
                  echo "Exit code: $apktool_exit"
                fi
              else
                echo "Apktool produced no output."
                echo "Exit code: $apktool_exit"
              fi

              if [ "$apktool_exit" -ne 0 ]; then
                echo "Last Apktool log lines:"
                tail -n 40 "$out/_logs/apktool.log"
              fi
            fi

            # Record successfully processed originals
            if [ "$input_success" = true ]; then
              successful=$((successful + 1))
              printf '%s\0' "$rel" >> "$SUCCESS_LIST"
              echo "RESULT: SUCCESS"
            else
              echo "RESULT: FAILED OR PARTIAL"
              echo "Original file will be kept."
            fi

          done < <(
            find . -type f \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './jadx-dist/*' \
              -not -name 'jadx.zip' \
              -not -name 'apktool.jar' \
              -print0
          )

          echo "================================"
          echo "Detected files: $count"
          echo "Successfully processed: $successful"

          echo "Detected: $count" > "$WORKDIR/_report.txt"
          echo "Successfully processed: $successful" >> "$WORKDIR/_report.txt"
          echo "Partial or failed: $((count - successful))" >> "$WORKDIR/_report.txt"

          if [ "$any_output" = true ]; then
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$successful" -gt 0 ]; then
            echo "has_successful_inputs=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$any_output" = false ]; then
            echo "No decompilation output was generated."
          fi

      - name: Create and verify ZIP and TAR
        if: steps.decompile.outputs.has_output == 'true'
        run: |
          cd "$RUNNER_TEMP"

          echo "Creating ZIP..."
          zip -qr decompiled-files.zip decompiled-output/

          echo "Creating TAR..."
          tar -cf decompiled-files.tar decompiled-output/

          echo "Verifying ZIP..."
          unzip -t decompiled-files.zip

          echo "Verifying TAR..."
          tar -df decompiled-files.tar

          echo "Both archives passed integrity checks."

      - name: Upload ZIP
        if: steps.decompile.outputs.has_output == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-files-zip
          path: ${{ runner.temp }}/decompiled-files.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload TAR
        if: steps.decompile.outputs.has_output == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-files-tar
          path: ${{ runner.temp }}/decompiled-files.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Delete successfully processed originals
        if: steps.decompile.outputs.has_successful_inputs == 'true'
        shell: bash
        run: |
          SUCCESS_LIST="$RUNNER_TEMP/successful-inputs.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r -d '' file; do
            echo "Deleting: $file"
            git rm -- "$file"
          done < "$SUCCESS_LIST"

          if git diff --cached --quiet; then
            echo "No deletions to commit."
            exit 0
          fi

          git commit -m "Remove successfully decompiled files"

          git push
