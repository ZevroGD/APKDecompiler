name: Universal Decompiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip zip tar

      - name: Download JADX
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest |
            jq -r '[.assets[] | select(.name | test("^jadx-.*\\.zip$"))][0].browser_download_url')

          test "$URL" != "null"
          curl -fL "$URL" -o jadx.zip
          unzip -q jadx.zip -d jadx-dist

          JADX=$(find jadx-dist -type f -path '*/bin/jadx' | head -n 1)
          test -n "$JADX"
          chmod +x "$JADX"

          echo "JADX=$PWD/$JADX" >> "$GITHUB_ENV"

      - name: Download Apktool
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/latest |
            jq -r '[.assets[] | select(.name | test("^apktool_.*\\.jar$"))][0].browser_download_url')

          test "$URL" != "null"
          curl -fL "$URL" -o apktool.jar

          echo "APKTOOL=$PWD/apktool.jar" >> "$GITHUB_ENV"

      - name: Detect and decompile
        id: decompile
        shell: bash
        run: |
          WORKDIR="$RUNNER_TEMP/decompiled-output"
          SUCCESS_LIST="$RUNNER_TEMP/successful-inputs.txt"

          mkdir -p "$WORKDIR"
          : > "$SUCCESS_LIST"

          count=0
          successful=0

          while IFS= read -r -d '' file; do
            rel="${file#./}"
            ext="${file##*.}"
            ext=$(echo "$ext" | tr '[:upper:]' '[:lower:]')

            case "$ext" in
              apk|dex|jar|class|aar|aab|zip|xapk|apkm|apks)
                ;;
              *)
                continue
                ;;
            esac

            count=$((count + 1))
            out="$WORKDIR/$rel"

            mkdir -p "$out"

            echo "================================"
            echo "Processing: $rel"
            echo "Format: $ext"

            success=true

            if [ "$ext" = "apk" ]; then
              echo "Running JADX..."
              if ! "$JADX" -d "$out/jadx" "$file"; then
                echo "JADX failed on $rel"
                success=false
              fi

              echo "Running Apktool..."
              if ! java -jar "$APKTOOL" d -f "$file" \
                -o "$out/apktool"; then
                echo "Apktool failed on $rel"
                success=false
              fi
            else
              echo "Running JADX..."
              if ! "$JADX" -d "$out/jadx" "$file"; then
                echo "JADX failed on $rel"
                success=false
              fi
            fi

            if [ "$success" = true ]; then
              successful=$((successful + 1))
              printf '%s\0' "$rel" >> "$SUCCESS_LIST"
              echo "Successfully processed: $rel"
            else
              echo "Keeping original file because processing failed."
            fi

          done < <(
            find . -type f \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './jadx-dist/*' \
              -not -name 'jadx.zip' \
              -not -name 'apktool.jar' \
              -print0
          )

          echo "================================"
          echo "Detected: $count"
          echo "Successfully processed: $successful"

          if [ "$successful" -eq 0 ]; then
            echo "No successfully processed files."
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"

          echo "Detected: $count" > "$WORKDIR/_report.txt"
          echo "Successfully processed: $successful" >> "$WORKDIR/_report.txt"

      - name: Create and verify ZIP and TAR
        if: steps.decompile.outputs.has_files == 'true'
        run: |
          cd "$RUNNER_TEMP"

          echo "Creating ZIP..."
          zip -qr decompiled-files.zip decompiled-output/

          echo "Creating TAR..."
          tar -cf decompiled-files.tar decompiled-output/

          echo "Verifying ZIP..."
          unzip -t decompiled-files.zip

          echo "Verifying TAR..."
          tar -tf decompiled-files.tar > /dev/null

          echo "Both archives passed integrity checks."

      - name: Upload ZIP
        if: steps.decompile.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-files-zip
          path: ${{ runner.temp }}/decompiled-files.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload TAR
        if: steps.decompile.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-files-tar
          path: ${{ runner.temp }}/decompiled-files.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Delete successfully processed originals
        if: steps.decompile.outputs.has_files == 'true'
        shell: bash
        run: |
          SUCCESS_LIST="$RUNNER_TEMP/successful-inputs.txt"

          if [ ! -s "$SUCCESS_LIST" ]; then
            echo "No files to delete."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r -d '' file; do
            echo "Deleting: $file"
            git rm -- "$file"
          done < "$SUCCESS_LIST"

          if git diff --cached --quiet; then
            echo "No deletions to commit."
            exit 0
          fi

          git commit -m "Remove successfully decompiled files"

          git push
